
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriVision AI Platform</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                50: 'var(--slate-50, #f8fafc)',
                100: 'var(--slate-100, #f1f5f9)',
                200: 'var(--slate-200, #e2e8f0)',
                300: 'var(--slate-300, #cbd5e1)',
                400: 'var(--slate-400, #94a3b8)',
                500: 'var(--slate-500, #64748b)',
                600: 'var(--slate-600, #475569)',
                700: 'var(--slate-700, #334155)',
                800: 'var(--slate-800, #1e293b)',
                900: 'var(--slate-900, #0f172a)',
                950: 'var(--slate-950, #020617)',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --slate-50: #f8fafc;
        --slate-100: #f1f5f9;
        --slate-200: #e2e8f0;
        --slate-300: #cbd5e1;
        --slate-400: #94a3b8;
        --slate-500: #64748b;
        --slate-600: #475569;
        --slate-700: #334155;
        --slate-800: #1e293b;
        --slate-900: #0f172a;
        --slate-950: #020617;
      }

      /* Dark Black Theme */
      html.theme-dark-black {
        --slate-50: #fafafa;
        --slate-100: #f5f5f5;
        --slate-200: #e5e5e5;
        --slate-300: #d4d4d4;
        --slate-400: #a3a3a3;
        --slate-500: #737373;
        --slate-600: #525252;
        --slate-700: #262626;
        --slate-800: #171717;
        --slate-900: #000000;
        --slate-950: #000000;
      }

      /* Dark Green Theme */
      html.theme-dark-green {
        --slate-50: #f8fafc;
        --slate-100: #f1f5f9;
        --slate-200: #e2e8f0;
        --slate-300: #cbd5e1;
        --slate-400: #94a3b8;
        --slate-500: #64748b;
        --slate-600: #475569;
        --slate-700: #27352b;
        --slate-800: #1b251e;
        --slate-900: #101713;
        --slate-950: #080c0a;
      }

      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--slate-100, #f1f5f9); 
      }
      ::-webkit-scrollbar-thumb {
        background: var(--slate-300, #cbd5e1); 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--slate-400, #94a3b8); 
      }
      .dark ::-webkit-scrollbar-track {
        background: var(--slate-800, #1e293b);
      }
      .dark ::-webkit-scrollbar-thumb {
        background: var(--slate-600, #475569);
      }
  </style>
</head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
